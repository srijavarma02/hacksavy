<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Test Panel - Smart Campus</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }
    
    select, button {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
    }
    
    select:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 30px;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button.whatsapp {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    }
    
    button.whatsapp:hover {
      box-shadow: 0 10px 20px rgba(37, 211, 102, 0.4);
    }
    
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    
    .result.success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
      display: block;
    }
    
    .result.error {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
      display: block;
    }
    
    .result.loading {
      background: #d1ecf1;
      color: #0c5460;
      border: 2px solid #bee5eb;
      display: block;
    }
    
    .message-preview {
      margin-top: 10px;
      padding: 12px;
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      border-radius: 4px;
      font-size: 13px;
      color: #333;
      line-height: 1.6;
    }
    
    .emoji {
      font-size: 20px;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 SMS Test Panel</h1>
    <p class="subtitle">Send test notifications for demo purposes</p>
    
    <div class="form-group">
      <label for="building">Select Building</label>
      <select id="building">
        <option value="1">Engineering Block</option>
        <option value="2">Science Lab</option>
        <option value="3">Library</option>
        <option value="4">Dorm A</option>
        <option value="5">Dorm B</option>
        <option value="6">Sports Center</option>
        <option value="7">Admin Building</option>
      </select>
    </div>
    
    <div class="button-group">
      <button onclick="sendNotification('sms')">
        <span class="emoji">📱</span> Send SMS
      </button>
      <button class="whatsapp" onclick="sendNotification('whatsapp')">
        <span class="emoji">💬</span> Send WhatsApp
      </button>
    </div>
    
    <div id="result" class="result"></div>
  </div>
  
  <script>
    async function sendNotification(type) {
      const buildingId = document.getElementById('building').value;
      const resultDiv = document.getElementById('result');
      
      // Show loading
      resultDiv.className = 'result loading';
      resultDiv.innerHTML = `<span class="emoji">⏳</span> Sending ${type.toUpperCase()} notification...`;
      
      try {
        const response = await fetch('http://localhost:8080/api/test-notification', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ buildingId: parseInt(buildingId), type })
        });
        
        const result = await response.json();
        
        if (result.success && result.notification) {
          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            <div><span class="emoji">✅</span> <strong>Success!</strong> ${result.message}</div>
            <div style="margin-top: 10px;">
              <strong>Recipient:</strong> ${result.notification.recipient}<br>
              <strong>Phone:</strong> ${result.notification.phone}<br>
              <strong>Channel:</strong> ${result.notification.channel}<br>
              <strong>Status:</strong> ${result.notification.status}
              ${result.notification.twilioSid ? `<br><strong>Twilio SID:</strong> ${result.notification.twilioSid}` : ''}
            </div>
            <div class="message-preview">
              <strong>Message:</strong><br>
              ${result.notification.message}
            </div>
          `;
        } else if (result.success && !result.notification) {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `<span class="emoji">⏳</span> ${result.message || 'Notification was rate limited. Try again in 15 minutes.'}`;
        } else {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `<span class="emoji">❌</span> <strong>Failed!</strong> ${result.error || 'Unknown error'}`;
        }
      } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          <div><span class="emoji">❌</span> <strong>Connection Error!</strong></div>
          <div style="margin-top: 10px;">
            ${error.message}<br><br>
            <strong>Make sure the server is running:</strong><br>
            <code>npm run server</code>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
